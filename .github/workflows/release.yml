name: Release to PyPI

# Publishes to PyPI when a vX.Y.Z tag is pushed. Uses trusted publishing (OIDC):
# no tokens, no secrets. Requires a ONE-TIME setup on PyPI (below).
#
# One-time steps (done by the package owner):
#   1. Create the project/name "hipercampo" at https://pypi.org
#   2. Under "Publishing", add a GitHub Actions Trusted Publisher:
#        owner: armandojaleo   repo: hipercampo   workflow: release.yml
#   3. From then on, every vX.Y.Z tag publishes on its own.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A `permissions:` block sets every unlisted scope to `none`, so `contents`
      # was implicitly none and checkout only worked because the repo is public.
      # Stating it keeps the job working if the repo ever goes private, and keeps
      # the grant explicit rather than accidental.
      contents: read
      id-token: write        # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          pip install build twine
          python -m build

      # Validate the ARTEFACT before publishing: metadata, that the version matches the
      # tag, that the wheel installs in a clean environment, imports, that the command
      # starts, and that the MCP server answers the handshake.
      - name: twine check
        run: twine check dist/*
      - name: Version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(ls dist/*.whl | sed -E 's/.*hipercampo-([^-]+)-py3.*/\1/')
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"
      - name: Install the wheel in a clean environment and check it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python -c "import hipercampo; print('version:', hipercampo.__version__)"
          /tmp/venv/bin/python scripts/mcp_smoke.py /tmp/venv/bin/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
