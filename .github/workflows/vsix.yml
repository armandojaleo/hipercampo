name: Publish viewer (VS Code Marketplace)

# Publishes the editor/ extension to the Marketplace when a viewer-vX.Y.Z tag is
# pushed. Requires the VSCE_PAT secret (see editor/PUBLISHING.md); without it, nothing.
on:
  push:
    tags: ["viewer-v*"]

# Least privilege: publishing to the Marketplace uses VSCE_PAT, never GITHUB_TOKEN,
# so the token needs nothing beyond reading the checkout.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install browser for viewer tests
        run: npx playwright install --with-deps chromium

      - name: Build and test
        run: npm run test:all

      - name: Tag version must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#viewer-v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag ($TAG) does not match package.json ($PKG)"; exit 1; }

      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is missing (see editor/PUBLISHING.md)"; exit 1
          fi
          # No `-p "$VSCE_PAT"`: vsce reads the token from the VSCE_PAT environment
          # variable on its own. Passing it as an argument put the secret in the
          # process argv, where any other process on the runner can read it — and it
          # would land in a trace if anyone ever adds `set -x`. The env var is
          # already there; the flag only added exposure.
          npx --yes @vscode/vsce@3.9.2 publish
