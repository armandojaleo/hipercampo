name: Publicar visor (VS Code Marketplace)

# Publica la extensión editor/ en el Marketplace al empujar un tag viewer-vX.Y.Z.
# Requiere el secreto VSCE_PAT (ver editor/PUBLISHING.md). Sin ese secreto no hace nada.
on:
  push:
    tags: ["viewer-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y probar
        run: npm test

      - name: La versión del tag debe coincidir con package.json
        run: |
          TAG="${GITHUB_REF_NAME#viewer-v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::el tag ($TAG) no coincide con package.json ($PKG)"; exit 1; }

      - name: Publicar en el Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::falta el secreto VSCE_PAT (ver editor/PUBLISHING.md)"; exit 1
          fi
          npx --yes @vscode/vsce@3.9.2 publish -p "$VSCE_PAT"
