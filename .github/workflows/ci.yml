name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar JavaScript del webview
        run: node --check media/viewer.js
      - name: Compilar y probar extensión
        run: npm test

  test:
    # hipercampo es una app LOCAL: Windows y macOS no son opcionales.
    # La matriz completa solo en la versión estable; los extremos, en Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e . ruff coverage mypy pytest

      - name: Lint (ruff)
        run: python -m ruff check hipercampo/ tests/ scripts/ examples/

      # Puerta de tipos: un None sin comprobar o una asignación incompatible no entra.
      # Independiente de plataforma, así que basta una celda de la matriz.
      - name: Type-check (mypy)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m mypy hipercampo/

      # Cadena de suministro: escaneo de CVEs conocidas del árbol de dependencias.
      # Informativo por ahora (no bloquea): sirve para VER una vulnerabilidad en cuanto
      # aparece, sin romper el verde por un aviso en una transitiva que no controlamos.
      # Volver bloqueante (quitar continue-on-error) cuando el árbol esté limpio.
      # Ver la política en SECURITY.md.
      - name: Supply-chain audit (pip-audit)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --desc

      - name: Test suite (todas las suites, incluidas las generativas)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          # Glob, NO lista a mano: un fichero de test nuevo entra solo en la matriz.
          # Antes se enumeraban a mano y se colaban ficheros sin correr en Windows/macOS
          # (list, budget, purge, core_embebible), justo donde viven los bugs de plataforma.
          shopt -s nullglob
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

      # Cobertura con SUELO: si baja del 78%, el CI falla. No se persigue el 100%
      # (hay ramas que solo se dan en fallos de hardware); se persigue no retroceder.
      - name: Cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          HIPERCAMPO_LOG: "0"
        run: |
          set -e
          coverage erase
          for t in tests/test_*.py; do coverage run -a --source=hipercampo "$t" >/dev/null; done
          coverage report --sort=cover
          coverage report --fail-under=78

  benchmarks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e . ruff coverage

      - name: Lint (ruff)
        run: python -m ruff check hipercampo/ tests/ scripts/ examples/
      - name: Benchmark de calidad (modo léxico)
        run: python scripts/benchmark.py
      - name: Gate navegable sobre corpus real (calidad, latencia y memoria)
        env:
          HIPERCAMPO_LOG: "0"
        run: python scripts/nav_real.py --check
      - name: Banco de estrés (10 hechos + 10 distractores confusos)
        run: python scripts/stress.py
      - name: Latencia y RAM de recall a escala (p50/p95/p99, con y sin cota)
        env:
          HIPERCAMPO_LOG: "0"
        run: python scripts/latency.py 1000 5000 10000
      - name: Comparativa con baselines (BM25 vs hipercampo, léxico)
        run: python scripts/baselines.py
      - name: Ablaciones cognitivas (sorpresa, confianza, propagación, consolidación)
        env:
          HIPERCAMPO_LOG: "0"
        run: python scripts/ablations.py --check
      - name: Eficiencia de contexto (calidad, tokens y latencia)
        env:
          HIPERCAMPO_LOG: "0"
        run: python scripts/context_efficiency.py --check
      - name: Ejemplos de uso (smoke)
        run: |
          for e in examples/*.py; do echo "== $e =="; python "$e"; done
