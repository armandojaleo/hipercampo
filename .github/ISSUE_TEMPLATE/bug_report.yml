name: "🐛 Bug / Fallo"
description: "Something isn't working as it should · Algo no funciona como debería"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting — the more concrete, the faster the fix.
        *Gracias por reportarlo: cuanto más concreto, antes se arregla. Español o English, both fine.*

  - type: textarea
    id: what-happens
    attributes:
      label: "What happens? · ¿Qué pasa?"
      description: "What you expected, and what happened instead."
      placeholder: "I expected hc_recall to return X, but it returned Y…"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "How to reproduce · Cómo reproducirlo"
      description: "Steps, or a minimal snippet."
      render: python
      placeholder: |
        from hipercampo import Hipercampo
        hc = Hipercampo("data/x.db")
        hc.remember("...")
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Traceback / logs"
      description: "The full error, if there is one."
      render: shell

  - type: input
    id: version
    attributes:
      label: "hipercampo version · Versión"
      description: "python -c \"import hipercampo; print(hipercampo.__version__)\""
      placeholder: "0.1.0b1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment · Entorno"
      placeholder: "Windows 11 · Python 3.13 · Claude Code"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "Checks · Comprobaciones"
      options:
        - label: "I looked for an existing issue about this · He mirado si ya existe una issue parecida"
        - label: "No personal data or secrets in this report · Sin datos personales ni secretos"
