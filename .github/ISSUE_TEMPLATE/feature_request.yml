name: "💡 Idea / Improvement"
description: "Propose a feature or a change · Proponer una funcionalidad o un cambio"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        In this project we **measure before believing**. If your idea claims to improve
        something, think about how that claim could be tested.
        *Aquí medimos antes de creer: piensa cómo se comprobaría. Español o English, both fine.*

  - type: textarea
    id: problem
    attributes:
      label: "What problem does it solve? · ¿Qué problema resuelve?"
      description: "The real use case — not the solution yet."
      placeholder: "With thousands of memories, recall takes too long because…"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposal · Propuesta"
      description: "How you would approach it."
    validations:
      required: true

  - type: textarea
    id: measurement
    attributes:
      label: "How would we measure it? · ¿Cómo se mediría?"
      description: "Which test or benchmark would show it works — or that it doesn't."
      placeholder: "A case in scripts/baselines.py measuring MRR before/after…"

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives and downsides · Alternativas y pegas"
      description: "What gets lost or more complicated with this change."

  - type: checkboxes
    id: scope
    attributes:
      label: "Fit with the project · Encaje con el proyecto"
      options:
        - label: "Fits the local-first scope (no central server, no multi-tenancy) · Encaja con el alcance local-first"
        - label: "Any new dependency would go in an optional extra, and credited · Dependencias nuevas en un extra opcional y acreditadas"
