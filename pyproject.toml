[project]
name = "hipercampo"
version = "0.1.0b10"
description = "Living, local-first memory for Claude built on hypervectors (VSA): surprise-gated writing, sleep consolidation, active forgetting, and compositional role queries. MCP server, CPU-only, no embeddings required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Armando Jaleo" }]
keywords = ["memory", "vsa", "hyperdimensional-computing", "hdc", "llm", "agent-memory",
            "mcp", "claude", "associative-memory", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "mcp>=1.28.1,<2",
]

[project.urls]
Homepage = "https://github.com/armandojaleo/hipercampo"
Repository = "https://github.com/armandojaleo/hipercampo"
Issues = "https://github.com/armandojaleo/hipercampo/issues"
Changelog = "https://github.com/armandojaleo/hipercampo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Hook semántico OPCIONAL. Trae modelos de terceros con su propia licencia
# (ver ATTRIBUTION.md). No se instala por defecto: el core es VSA puro, CPU.
semantic = ["sentence-transformers>=2.2"]
# OPCIONAL: mejora `servers`/`restart`/`status` para identificar qué fichero y
# contexto sirve cada servidor MCP (lee el entorno del proceso). Sin él, todo
# funciona igual pero esa identidad no siempre es legible (sobre todo en Windows).
procs = ["psutil>=5.9"]

[project.scripts]
hipercampo = "hipercampo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hipercampo"]

[tool.mypy]
# Puerta de tipos sobre el núcleo. No es --strict (el código usa numpy y dicts
# JSON heterogéneos donde el tipado total estorba más que ayuda); es el nivel que
# caza bugs reales —Nones sin comprobar, asignaciones incompatibles— sin ahogar.
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E702 (a; b): estilo de la casa en tests y CLI compactos — legible y deliberado.
ignore = ["E702", "E701"]
